name: Build and deploy Ortak Roman

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Supabase build secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL repository secret" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY repository secret" && exit 1)
          node --input-type=module <<'NODE'
          const value = process.env.VITE_SUPABASE_URL.trim();
          let parsed;
          try { parsed = new URL(value); } catch { throw new Error('VITE_SUPABASE_URL is not a valid URL.'); }
          if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.supabase.co')) {
            throw new Error('VITE_SUPABASE_URL must be an HTTPS Supabase project URL.');
          }
          NODE
          echo "Supabase build configuration is present."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify Supabase configuration was embedded
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const files = readdirSync('dist/assets').filter((name) => name.endsWith('.js'));
          const bundle = files.map((name) => readFileSync(join('dist/assets', name), 'utf8')).join('\n');
          if (!process.env.VITE_SUPABASE_URL || !bundle.includes(process.env.VITE_SUPABASE_URL)) {
            throw new Error('Supabase URL was not embedded in the production bundle.');
          }
          if (!process.env.VITE_SUPABASE_ANON_KEY || !bundle.includes(process.env.VITE_SUPABASE_ANON_KEY)) {
            throw new Error('Supabase publishable key was not embedded in the production bundle.');
          }
          console.log('Verified: Supabase URL and publishable key are embedded (values hidden).');
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
